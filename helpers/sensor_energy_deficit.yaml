# Template sensor: sensor.energy_deficit
# =======================================
# How many kWh the battery is short of sensor.target_soc_tonight right now.
#
# ── v4.0 ───────────────────────────────────────────────────────────────────
# Derived from the target sensor instead of repeating its ~100-line
# calculation. Up to v3.1 the two sensors carried identical copies of the
# forecast/profile logic that had to be kept in sync by hand.
#
#   deficit = max(target % − SOC %, 0) / 100 × capacity
#
# Returns 0 when the target is unavailable or SOC is below 5 % (treated as a
# bad reading — "don't charge on missing data").
#
# The value is now meaningful around the clock ("short of what's needed to
# reach 23:00"). Every automation that acts on it (A, C, E, F, G) is limited
# to the night window or checks the time itself.
#
# How to install:
#   Settings → Devices & Services → Helpers → Create Helper → Template → Sensor
#   Paste the `state:` block. Unit: kWh.
#
# Entity ID mapping (replace with your own):
#   input_number.battery_capacity_kwh, sensor.target_soc_tonight,
#   sensor.battery_soc_effective

state: >
  {% set bat = states('input_number.battery_capacity_kwh') | float(13.3) %}
  {% set target = states('sensor.target_soc_tonight') | float(-1) %}
  {% set soc_val = states('sensor.battery_soc_effective') | float(-1) %}
  {% if target < 0 or soc_val < 5 %}
    0
  {% else %}
    {{ (([target - soc_val, 0] | max) / 100 * bat) | round(2) }}
  {% endif %}

unit_of_measurement: kWh
