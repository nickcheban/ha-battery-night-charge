# Automation C: Emergency night correction
# ==========================================
# Reacts to sensor.energy_deficit changing during the night — the forecast or
# the battery diverging from what A assumed at 23:05.
#
#   need_charge: deficit rises above 0.7 kWh and holds 2 min → grid-charge mode
#   stop_charge: deficit falls below 0.3 kWh                  → autonomous mode
#
# Hysteresis (0.7 on / 0.3 off) keeps the mode from flipping on a single
# threshold. mode: restart — a fresh trigger always wins.
#
# ── v3.1 — synced with production ──────────────────────────────────────────
# The production automation differs from the v2.7/v3.0 shape documented in
# docs/anti-flapping-case-study.md:
#   - stop_charge has NO `for:` (fires immediately on the crossing);
#   - the need_charge branch has NO 30-minute minimum-runtime guard; only the
#     stop branch keeps it (grid-charging for ≥ 30 min before stopping);
#   - both branches require the grid to be present (inverter input > 200 V):
#     need_charge so it doesn't "start" charging into an outage, stop_charge so
#     it doesn't report "deficit closed" for a charge that never happened;
#   - mode changes go through script.inverter_set_mode_with_retry.
# The case study's argument for symmetric debounce still stands; the running
# system simply doesn't implement it fully. Listed under README → Known issues.
#
# Entity ID mapping (replace with your own):
#   sensor.energy_deficit, sensor.battery_soc_effective,
#   sensor.inverter_grid_voltage, select.inverter_output_priority,
#   script.inverter_set_mode_with_retry, notify.YOUR_TELEGRAM_BOT

alias: "EMS: Emergency night correction (C)"
description: >
  v3.1 — deficit > 0.7 kWh for 2 min while autonomous and grid present →
  grid-charge; deficit < 0.3 kWh after ≥ 30 min of grid-charging and grid
  present → autonomous. Window 23:06–06:57.

triggers:
  - trigger: numeric_state
    entity_id: sensor.energy_deficit
    above: 0.7
    for:
      minutes: 2
    id: need_charge
  - trigger: numeric_state
    entity_id: sensor.energy_deficit
    below: 0.3
    id: stop_charge

conditions:
  - condition: time
    after: "23:06:00"
    before: "06:57:00"

actions:
  - choose:
      - alias: "Deficit grew → grid-charge mode"
        conditions:
          - condition: trigger
            id: need_charge
          - condition: state
            entity_id: select.inverter_output_priority
            state: AUTONOMOUS
          - condition: numeric_state
            entity_id: sensor.inverter_grid_voltage
            above: 200
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.battery_soc_effective
                state: ["unavailable", "unknown", "none", "None", ""]
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                EMS: emergency grid-charge (C)
                Deficit: {{ states('sensor.energy_deficit') }} kWh | SOC: {{ states('sensor.battery_soc_effective') }}%
                Grid: {{ states('sensor.inverter_grid_voltage') }} V
          - action: script.inverter_set_mode_with_retry
            data:
              output_priority: GRID_CHARGE
              charge_priority: SOLAR_AND_GRID
              caller_tag: C
      - alias: "Deficit closed → autonomous mode"
        conditions:
          - condition: trigger
            id: stop_charge
          - alias: "Grid-charging for at least 30 minutes"
            condition: state
            entity_id: select.inverter_output_priority
            state: GRID_CHARGE
            for:
              minutes: 30
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.battery_soc_effective
                state: ["unavailable", "unknown", "none", "None", ""]
          - alias: "Charging was real — grid present"
            condition: numeric_state
            entity_id: sensor.inverter_grid_voltage
            above: 200
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                EMS: deficit closed, charging stopped (C)
                Deficit: {{ states('sensor.energy_deficit') }} kWh | SOC: {{ states('sensor.battery_soc_effective') }}%
          - action: script.inverter_set_mode_with_retry
            data:
              output_priority: AUTONOMOUS
              charge_priority: SOLAR_ONLY
              caller_tag: C

mode: restart
trace:
  stored_traces: 30
