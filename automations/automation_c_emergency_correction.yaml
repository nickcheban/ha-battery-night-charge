# Automation C: Emergency night correction
# ==========================================
# Reacts to sensor.energy_deficit changing during the night — handles the
# case where reality diverges from the forecast mid-night.
#
# Two triggers:
#   need_charge: energy_deficit rises above 0.7 kWh for 2 minutes → turn ON
#   stop_charge: energy_deficit falls below 0.3 kWh for 2 minutes → turn OFF
#
# Hysteresis (0.7 on / 0.3 off) prevents oscillation — the breaker won't
# flicker on/off if the deficit hovers near a single threshold.
#
# mode: restart ensures a fresh trigger always takes priority over a previous
# run still resolving its sequence (e.g. a new need_charge trigger cancels
# a stop_charge that was in progress).
#
# ── v2.7 — real-world anti-flapping fix ──────────────────────────────────
# A production night with a recently upgraded (larger) inverter produced 5
# breaker on/off cycles, including one 3-second on→off flap. Root-caused to
# two gaps in v2.6, both fixed here. Full incident writeup, including how it
# was diagnosed from history + trace data:
# docs/anti-flapping-case-study.md (EN) / .ru.md (RU).
#
# Design decisions (current, v2.7):
#
#   for: 2 minutes on BOTH need_charge and stop_charge (was: only need_charge)
#     v2.6 debounced the turn-on trigger but not the turn-off trigger — a
#     single noisy dip below 0.3 kWh fired turn-off instantly. This asymmetry
#     is exactly the kind of thing that produces short cycling once the
#     underlying sensor gets noisier (e.g. a bigger inverter reaches SOC
#     thresholds faster, so more raw deficit ticks land near the boundary).
#     Standard HA community guidance for a bouncing signal: debounce with
#     `for:` — and debounce it the same way on both sides of a hysteresis
#     band, not just one.
#
#   Native `for:` state condition — both directions (was: template + one
#   direction only)
#     v2.6 had a 30-minute minimum-runtime guard, but only on turn-off, and
#     implemented as a `condition: template` doing manual
#     `(now() - last_changed)` duration math. Two problems: (1) nothing
#     stopped the breaker from being flipped back on within seconds of
#     turning off, which is what actually produced the 3-second flap; (2)
#     template duration math bypasses HA's config-load-time validation and
#     fails silently at runtime, whereas a native `for:` on a `state`
#     condition is schema-validated. This mirrors the same
#     `min_cycle_duration` pattern HA's own `generic_thermostat` uses to
#     protect compressors from short-cycling — applied here symmetrically to
#     both the on and off branches.
#
#   Trade-off worth knowing: during the 30-minute post-flip cooldown, C
#   will not react even to a real, sudden deficit spike. This is deliberate
#   — automation A (23:05, the primary decision) and branch 4 of automation
#   E (emergency on, battery <49V) are not gated by this cooldown and remain
#   the safety net for genuinely urgent cases.
#
#   Voltage check on turn-on only
#     The >210 V voltage check (real grid present) is applied to the turn-on
#     branch. No voltage check on turn-off — we always want to be able to
#     turn the breaker off.
#
#   SOC validity on turn-off
#     Prevents false turn-off caused by BMS flapping to unknown — when SOC
#     becomes unknown, energy_deficit sensor returns 0 (by design, as a safety
#     default), which would trigger stop_charge. The validity check blocks this.
#
# Entity ID mapping (replace with your own):
#   sensor.energy_deficit           → energy deficit template sensor (kWh)
#   switch.grid_switch              → your smart breaker switch entity
#   sensor.breaker_voltage          → voltage sensor on the smart breaker (V)
#   sensor.battery_soc_effective    → BMS SOC sensor
#   input_number.locked_target_soc  → helper written by automation A at 23:05
#   notify.YOUR_TELEGRAM_BOT        → your Telegram notify entity

alias: "EMS: Emergency night correction (C)"
description: >
  v2.7 — symmetric debounce: for:2min added to stop_charge trigger (was
  on need_charge only). Native for:30min state condition on the breaker
  replaces the old template last_changed check, applied to BOTH the
  turn-on and turn-off branches (was turn-off only). Fixes a real
  multi-cycle flapping incident — see docs/anti-flapping-case-study.md.

triggers:
  - trigger: numeric_state
    entity_id: sensor.energy_deficit
    above: 0.7
    for:
      minutes: 2
    id: need_charge
  - trigger: numeric_state
    entity_id: sensor.energy_deficit
    below: 0.3
    for:
      minutes: 2
    id: stop_charge

conditions:
  - condition: time
    after: "23:06:00"
    before: "06:57:00"
  - alias: "SOC reading is valid"
    condition: template
    value_template: >
      {{ states('sensor.battery_soc_effective') not in
         ['unavailable', 'unknown', 'none', 'None', ''] }}

actions:
  - choose:
      - alias: "Deficit too high — turn breaker on"
        conditions:
          - condition: trigger
            id: need_charge
          - alias: "Breaker has been off for at least 30 minutes"
            condition: state
            entity_id: switch.grid_switch
            state: "off"
            for:
              minutes: 30
          - condition: numeric_state
            entity_id: sensor.breaker_voltage
            above: 210
            alias: "Real grid present (>210 V, not phantom voltage)"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.grid_switch
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                ⚡ *EMS: Emergency charge — night (C)*
                Need: {{ states('sensor.energy_deficit') }} kWh
                | SOC: {{ states('sensor.battery_soc_effective') }}%
                | Target: {{ states('input_number.locked_target_soc') | int }}%

      - alias: "Deficit cleared — turn breaker off"
        conditions:
          - condition: trigger
            id: stop_charge
          - alias: "Breaker has been on for at least 30 minutes"
            condition: state
            entity_id: switch.grid_switch
            state: "on"
            for:
              minutes: 30
          - alias: "SOC valid before turning off"
            condition: template
            value_template: >
              {{ states('sensor.battery_soc_effective') not in
                 ['unavailable', 'unknown', 'none', 'None', ''] }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.grid_switch
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                ✅ *EMS: Deficit cleared — breaker off (C)*
                Remaining: {{ states('sensor.energy_deficit') }} kWh
                | SOC: {{ states('sensor.battery_soc_effective') }}%

mode: restart

trace:
  stored_traces: 30
