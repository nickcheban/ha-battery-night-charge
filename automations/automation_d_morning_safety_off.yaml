# Automation D: Morning safety reset — unconditional
# =====================================================
# Switches the inverter back to autonomous mode at 06:58 every morning.
# No conditions. No exceptions. This is the dumb safety layer that exists
# because smart logic can fail: whatever A, B, C or E did (or failed to do)
# overnight, the inverter is out of grid-charge mode before daytime tariff.
#
# ── v3.1 — synced with production ──────────────────────────────────────────
# Goes through script.inverter_set_mode_with_retry, so a dropped write is
# retried once after 30 s and reported if it still fails ("inverter stays in
# grid-charge mode all day" is exactly the failure this automation exists to
# prevent, so it's worth knowing about).
#
# Entity ID mapping: script.inverter_set_mode_with_retry

alias: "EMS: Morning safety reset 06:58 (D)"
description: >
  v3.1 — unconditional switch to autonomous mode at 06:58 via the retry
  script. Safety layer.

triggers:
  - trigger: time
    at: "06:58:00"

conditions: []

actions:
  - action: script.inverter_set_mode_with_retry
    data:
      output_priority: AUTONOMOUS
      charge_priority: SOLAR_ONLY
      caller_tag: D
      fail_context: "Inverter stays in grid-charge mode all day!"

mode: single
trace:
  stored_traces: 30
