# Automation D: Morning safety reset — unconditional
# =====================================================
# Switches the inverter back to autonomous (solar-only) mode at 06:58 every
# morning. No conditions. No notification. No exceptions.
#
# This is the dumb safety layer that exists specifically because smart logic
# can fail. If automation A misfired, if B never triggered, if C got stuck,
# if the BMS is unavailable, if the forecast API was down all night — this
# automation fires anyway and takes the inverter out of grid-charge mode
# before daytime peak tariff.
#
# v3.0 — retargeted from switch.turn_off (physical breaker) to
# select.select_option (inverter mode). Same "must work even if everything
# else is broken" role — see docs/model.md#inverter-mode-switching.
#
# Deliberately minimal:
#   - No conditions: must work even if every sensor is unavailable
#   - No notification: was removed by user request — a "target not reached"
#     notification based on a snapshot from 23:05 was misleading by 06:58
#     (the target was stale, and the inverter mode was already being managed
#     by automations B and C throughout the night)
#   - mode: single: cannot fire twice
#
# Entity ID mapping (replace with your own):
#   select.inverter_output_priority → inverter's output-source-priority select
#     (option used here: AUTONOMOUS — vendor-specific string, see automation_a)
#   select.inverter_charge_priority → inverter's charge-source-priority select
#     (option used here: SOLAR_ONLY — vendor-specific string, see automation_a)

alias: "EMS: Morning safety reset (D)"
description: >
  v3.0 — unconditional switch to autonomous (solar-only) inverter mode at
  06:58. Safety layer, no conditions, no notification. This is the
  automation that must work even if everything else is broken. Retargeted
  from a physical breaker (v2.4) to the inverter's own mode selects.

triggers:
  - trigger: time
    at: "06:58:00"

conditions: []

actions:
  - action: select.select_option
    target:
      entity_id: select.inverter_output_priority
    data:
      option: AUTONOMOUS
  - action: select.select_option
    target:
      entity_id: select.inverter_charge_priority
    data:
      option: SOLAR_ONLY

mode: single
trace:
  stored_traces: 30
