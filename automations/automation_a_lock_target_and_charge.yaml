# Automation A: Night charge decision (23:05)
# ============================================
# Fires once per night at 23:05 (local time) and sets the inverter mode for
# the start of the night. The rest of the night is handled by B (stop at
# target), C (forecast changed), E (grid came back) and D (06:58 reset).
#
# ── v3.1 — synced with production ──────────────────────────────────────────
#   - Mode changes go through script.inverter_set_mode_with_retry (verified
#     write + one retry + alert) instead of two bare select calls.
#   - Grid presence is checked on the inverter's own grid-input voltage
#     (measured after the upstream voltage-protection relay), threshold 200 V.
#     The smart-breaker voltage sensor used before v3.1 is no longer read.
#   - New branch: charge is needed but there is no grid → only warn. The need
#     is not lost: E starts charging as soon as the grid returns, C if the
#     deficit keeps rising.
#   - If the SOC sensor is momentarily invalid at 23:05 (reads < 1 %), wait up
#     to 5 minutes for a real value before deciding.
#   - The target is NOT locked any more. input_number.locked_target_soc is
#     still written, but only for the notification text; B, C and E read the
#     live target (see README → "Don't snapshot the target").
#
# Known limitation: the grid check at 23:05:00 is an instantaneous reading
# with no debounce (a numeric_state condition cannot take `for:`). A template
# binary sensor with delay_on would fix it; not done.
#
# Entity ID mapping (replace with your own):
#   sensor.target_soc_tonight        → target SOC template sensor (%)
#   input_number.locked_target_soc   → helper, written here for display only
#   sensor.energy_deficit            → energy deficit template sensor (kWh)
#   sensor.battery_soc_effective     → SOC sensor
#   sensor.inverter_grid_voltage     → inverter grid-input voltage (V)
#   script.inverter_set_mode_with_retry → scripts/set_mode_with_retry.yaml
#   notify.YOUR_TELEGRAM_BOT         → your Telegram notify entity
#   Mode option strings (AUTONOMOUS, GRID_CHARGE, SOLAR_ONLY, SOLAR_AND_GRID)
#   are placeholders — see README → Entity ID mapping.

alias: "EMS: Night charge decision 23:05 (A)"
description: >
  v3.1 — at 23:05 switches the inverter to grid-charge mode if
  energy_deficit > 0.5 kWh, SOC is valid and the grid is present; warns if
  charge is needed but the grid is absent; otherwise switches to autonomous
  mode. All mode changes go through the retry script.

triggers:
  - trigger: time
    at: "23:05:00"

conditions: []

actions:
  - alias: "Record tonight's starting target (display only)"
    action: input_number.set_value
    target:
      entity_id: input_number.locked_target_soc
    data:
      value: "{{ states('sensor.target_soc_tonight') | int(20) }}"
  - delay:
      seconds: 2
  - alias: "Wait for a valid SOC if the sensor is flapping (up to 5 min)"
    if:
      - condition: numeric_state
        entity_id: sensor.battery_soc_effective
        below: 1
    then:
      - wait_for_trigger:
          - trigger: numeric_state
            entity_id: sensor.battery_soc_effective
            above: 0
        timeout:
          minutes: 5
        continue_on_timeout: true
  - choose:
      - alias: "Charge needed, grid present → grid-charge mode"
        conditions:
          - condition: numeric_state
            entity_id: sensor.energy_deficit
            above: 0.5
          - condition: numeric_state
            entity_id: sensor.battery_soc_effective
            above: 0
          - alias: "Grid present (inverter input voltage)"
            condition: numeric_state
            entity_id: sensor.inverter_grid_voltage
            above: 200
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                EMS: night charge starting 23:05 (A)
                SOC: {{ states('sensor.battery_soc_effective') }}% | Need: +{{ states('sensor.energy_deficit') }} kWh
                Target: {{ states('input_number.locked_target_soc') | int }}%
                Grid: {{ states('sensor.inverter_grid_voltage') }} V
          - action: script.inverter_set_mode_with_retry
            data:
              output_priority: GRID_CHARGE
              charge_priority: SOLAR_AND_GRID
              caller_tag: A
              fail_context: "Charging did NOT start!"
      - alias: "Charge needed, but no grid → warn only"
        conditions:
          - condition: numeric_state
            entity_id: sensor.energy_deficit
            above: 0.5
          - condition: numeric_state
            entity_id: sensor.battery_soc_effective
            above: 0
          - alias: "Grid absent"
            condition: numeric_state
            entity_id: sensor.inverter_grid_voltage
            below: 200
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                ⚠️ EMS: charge needed but NO GRID (A)
                SOC: {{ states('sensor.battery_soc_effective') }}% | Deficit: {{ states('sensor.energy_deficit') }} kWh
                Grid: {{ states('sensor.inverter_grid_voltage') }} V
                E/C will start charging when the grid returns.
    default:
      - action: notify.send_message
        target:
          entity_id: notify.YOUR_TELEGRAM_BOT
        data:
          message: >
            EMS: no charge needed 23:05 (A)
            SOC: {{ states('sensor.battery_soc_effective') }}% | Deficit: {{ states('sensor.energy_deficit') }} kWh
      - action: script.inverter_set_mode_with_retry
        data:
          output_priority: AUTONOMOUS
          charge_priority: SOLAR_ONLY
          caller_tag: A

mode: single
trace:
  stored_traces: 30
