# Automation A: Lock target SOC and set inverter charge mode for the night
# ===========================================================================
# Fires once per night at 23:05 (local time).
#
# ── v3.0 — architecture change: inverter mode switching, not breaker toggling ──
# Earlier versions of this package (v1.x–v2.7) decided whether to charge by
# turning a physical grid-input breaker on/off. After a hardware upgrade
# (larger hybrid inverter with independent output-source-priority and
# charge-source-priority selects), the breaker is now left permanently
# energised, and "charge from grid tonight, yes/no" is decided by switching
# the *inverter's own* mode instead. See docs/model.md#inverter-mode-switching
# for the full rationale — in short: the breaker only ever needs to gate
# whether the house is powered at all, not whether the battery charges from
# grid, so removing it from the nightly decision loop eliminates an entire
# class of relay-wear/flapping incidents (see
# docs/anti-flapping-case-study.md) at the source, rather than just
# debouncing around it.
#
# Steps:
#   1. Snapshots the current target SOC (from sensor.target_soc_tonight) into
#      input_number.locked_target_soc — so the target doesn't drift overnight
#      as the forecast updates.
#   2. Waits 2 seconds for the helper write to propagate.
#   3. If energy_deficit > 0.5 kWh AND SOC reading is valid:
#        → switches the inverter into grid-charge mode, sends Telegram
#          notification with details.
#      Otherwise:
#        → explicitly switches the inverter into autonomous (solar-only)
#          mode and sends a "no charge needed" notification.
#
# Note on the "otherwise" branch: unlike the old breaker-based version (where
# the breaker was normally already off, so the "no charge" path only had to
# notify), this version explicitly re-asserts autonomous mode every night at
# 23:05 regardless of what mode the inverter was left in during the day —
# the inverter's mode is stateful hardware config, not a momentary action, so
# the decision has to be asserted, not just implied by inaction.
#
# Entity ID mapping (replace with your own):
#   sensor.target_soc_tonight         → your target SOC template sensor (%)
#   input_number.locked_target_soc    → helper number (written here, read by B, C, E)
#   sensor.energy_deficit             → your energy deficit template sensor (kWh)
#   sensor.battery_soc_effective      → BMS/inverter SOC sensor — must go unavailable, not stale
#   input_number.battery_capacity_kwh → usable battery capacity in kWh
#   select.inverter_output_priority   → inverter's output-source-priority select
#     options used here: AUTONOMOUS (e.g. "PV-Battery-Utility" / "SBU") and
#     GRID_CHARGE (e.g. "PV-Utility-Battery" / "SUB") — exact option strings
#     are vendor/model-specific, check your inverter's integration
#   select.inverter_charge_priority   → inverter's charge-source-priority select
#     options used here: SOLAR_ONLY (e.g. "PV Priority") and
#     SOLAR_AND_GRID (e.g. "PV and Utility") — same caveat as above
#   sensor.grid_energy_deficit_info   → informational daily deficit sensor (optional)
#   sensor.pv_forecast_tomorrow       → Solcast tomorrow entity
#   sensor.energy_production_tomorrow → Open-Meteo Solar Forecast tomorrow entity
#   sensor.avg_load_7d                → 7-day average daily load sensor (optional)
#   notify.YOUR_TELEGRAM_BOT          → your Telegram notify entity

alias: "EMS: Lock target & set night charge mode (A)"
description: >
  v3.0 — fires at 23:05. Locks target SOC into helper, switches the inverter
  into grid-charge mode if energy_deficit > 0.5 kWh and SOC reading is valid,
  otherwise explicitly switches it into autonomous (solar-only) mode. No
  longer touches a physical grid breaker — see docs/model.md for why.

triggers:
  - trigger: time
    at: "23:05:00"

conditions: []

actions:
  # Step 1: snapshot target SOC so it doesn't drift overnight
  - action: input_number.set_value
    target:
      entity_id: input_number.locked_target_soc
    data:
      value: "{{ states('sensor.target_soc_tonight') | int(20) }}"

  # Step 2: wait for helper write to propagate
  - delay:
      seconds: 2

  # Step 3: decide
  - choose:
      - alias: "Battery won't last — switch inverter to grid-charge mode"
        conditions:
          - condition: numeric_state
            entity_id: sensor.energy_deficit
            above: 0.5
          - alias: "SOC reading is valid"
            condition: not
            conditions:
              - condition: state
                entity_id: sensor.battery_soc_effective
                state:
                  - "unavailable"
                  - "unknown"
        sequence:
          - action: select.select_option
            target:
              entity_id: select.inverter_output_priority
            data:
              option: GRID_CHARGE
          - action: select.select_option
            target:
              entity_id: select.inverter_charge_priority
            data:
              option: SOLAR_AND_GRID
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                🔌 *EMS: Grid-charge mode ON — 23:05*
                SOC: {{ states('sensor.battery_soc_effective') }}%
                ({{ (states('sensor.battery_soc_effective') | float(0) / 100
                  * states('input_number.battery_capacity_kwh') | float(13.3))
                  | round(1) }} kWh)
                | Target: {{ states('input_number.locked_target_soc') | int }}%
                | Need: +{{ states('sensor.energy_deficit') }} kWh
                Forecast deficit: {{ states('sensor.grid_energy_deficit_info') }} kWh
                | Open-Meteo: {{ states('sensor.energy_production_tomorrow') | float | round(1) }} kWh
                | Solcast: {{ states('sensor.pv_forecast_tomorrow') | float | round(1) }} kWh
                Avg load 7d: {{ states('sensor.avg_load_7d') }} kWh

    default:
      - action: select.select_option
        target:
          entity_id: select.inverter_output_priority
        data:
          option: AUTONOMOUS
      - action: select.select_option
        target:
          entity_id: select.inverter_charge_priority
        data:
          option: SOLAR_ONLY
      - action: notify.send_message
        target:
          entity_id: notify.YOUR_TELEGRAM_BOT
        data:
          message: >
            ✅ *EMS: No charge needed — 23:05*
            SOC: {{ states('sensor.battery_soc_effective') }}%
            ({{ (states('sensor.battery_soc_effective') | float(0) / 100
              * states('input_number.battery_capacity_kwh') | float(13.3))
              | round(1) }} kWh)
            | Need: {{ states('sensor.energy_deficit') }} kWh
            | Surplus: +{{ ((states('sensor.battery_soc_effective') | float(0) / 100
              * states('input_number.battery_capacity_kwh') | float(13.3))
              - (states('sensor.target_soc_tonight') | float(20) / 100
              * states('input_number.battery_capacity_kwh') | float(13.3)))
              | round(2) }} kWh
            Forecast deficit: {{ states('sensor.grid_energy_deficit_info') }} kWh
            | Open-Meteo: {{ states('sensor.energy_production_tomorrow') | float | round(1) }}
            | Solcast: {{ states('sensor.pv_forecast_tomorrow') | float | round(1) }} kWh
            Inverter set to autonomous (solar-only) mode.

mode: single
trace:
  stored_traces: 30
