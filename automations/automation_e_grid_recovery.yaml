# Automation E: Grid loss and grid recovery
# ==========================================
# The grid here is cut regularly — by scheduled outages and, much more often,
# by the household's own over/under-voltage protection relay (it opens above
# 255 V, and the street supply sits at 250–260 V at night). E keeps the
# inverter mode consistent with reality across those cuts.
#
# ── v3.1 — synced with production ──────────────────────────────────────────
# Grid presence is read from the inverter's own grid-input voltage (after the
# protection relay), not from the smart breaker's voltage sensor. The inverter
# is battery-powered, so its reading doesn't suffer from the breaker's
# "phantom voltage" (docs/phantom_voltage.md); the 2-minute hold on the
# recovery trigger is kept anyway.
#
# Three triggers:
#   (no id)   grid voltage > 200 V for 2 min — the grid came back
#   cron15    every 15 minutes — safety net in case the recovery edge was
#             missed (HA restart, integration reconnect)
#   grid_lost grid voltage < 50 V for 30 s — the grid went away
#
# Branches (first match wins):
#   1. grid_lost while grid-charging → autonomous mode, silently. Keeps HA's
#      idea of the mode in sync with what the inverter is physically doing.
#   2. Night + deficit > 0.5 + not grid-charging + grid present → grid-charge.
#   3. Same as 2, for the cron15 trigger (explicit trigger condition).
#   4. Night + SOC ≥ live target + 2 % while grid-charging → autonomous.
#   5. Daytime (06:58–23:01) while grid-charging → autonomous.
#   6. Battery < 49 V at any time → grid-charge (protect the battery).
#
# Known issue (branch 5 vs 6): in daytime with the battery below 49 V, cron15
# alternates between branch 6 (grid-charge) and branch 5 (back to autonomous)
# every 15 minutes, because 5 is checked first. In practice the inverter's own
# low-battery cut-over (52 V here) acts long before 49 V, so it hasn't fired.
#
# Branches 1, 4, 5 and 6 still write the selects directly instead of using the
# retry script.
#
# Entity ID mapping (replace with your own):
#   sensor.inverter_grid_voltage, sensor.energy_deficit,
#   sensor.battery_soc_effective, sensor.target_soc_tonight,
#   sensor.battery_voltage, select.inverter_output_priority,
#   select.inverter_charge_priority, script.inverter_set_mode_with_retry,
#   notify.YOUR_TELEGRAM_BOT

alias: "EMS: Grid loss / recovery (E)"
description: >
  v3.1 — grid lost → autonomous; grid back (2 min) or every 15 min → resume
  grid-charging if still needed at night; target already met → autonomous;
  daytime → autonomous; battery < 49 V → grid-charge.

triggers:
  - trigger: numeric_state
    entity_id: sensor.inverter_grid_voltage
    above: 200
    for:
      minutes: 2
  - trigger: time_pattern
    minutes: "/15"
    id: cron15
  - trigger: numeric_state
    entity_id: sensor.inverter_grid_voltage
    below: 50
    for:
      seconds: 30
    id: grid_lost

conditions: []

actions:
  - choose:
      - alias: "Grid lost → autonomous (no notification)"
        conditions:
          - condition: trigger
            id: grid_lost
          - condition: state
            entity_id: select.inverter_output_priority
            state: GRID_CHARGE
        sequence:
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: select.inverter_output_priority
            data:
              option: AUTONOMOUS
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: select.inverter_charge_priority
            data:
              option: SOLAR_ONLY

      - alias: "Night + charge needed → grid-charge"
        conditions:
          - condition: time
            after: "23:01:00"
            before: "06:58:00"
          - condition: numeric_state
            entity_id: sensor.energy_deficit
            above: 0.5
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.battery_soc_effective
                state: ["unavailable", "unknown", "none", "None", ""]
          - alias: "Not grid-charging"
            condition: not
            conditions:
              - condition: state
                entity_id: select.inverter_charge_priority
                state: SOLAR_AND_GRID
          - alias: "Grid present"
            condition: numeric_state
            entity_id: sensor.inverter_grid_voltage
            above: 200
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                EMS: grid back, charging resumed (E)
                SOC: {{ states('sensor.battery_soc_effective') }}% | Need: +{{ states('sensor.energy_deficit') }} kWh
                Grid: {{ states('sensor.inverter_grid_voltage') }} V
          - action: script.inverter_set_mode_with_retry
            data:
              output_priority: GRID_CHARGE
              charge_priority: SOLAR_AND_GRID
              caller_tag: E

      - alias: "cron15 safety net"
        conditions:
          - condition: trigger
            id: cron15
          - condition: time
            after: "23:01:00"
            before: "06:58:00"
          - condition: numeric_state
            entity_id: sensor.inverter_grid_voltage
            above: 200
          - condition: numeric_state
            entity_id: sensor.energy_deficit
            above: 0.5
          - condition: not
            conditions:
              - condition: state
                entity_id: select.inverter_charge_priority
                state: SOLAR_AND_GRID
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.battery_soc_effective
                state: ["unavailable", "unknown", "none", "None", ""]
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                EMS: charging restored (E cron15)
                SOC: {{ states('sensor.battery_soc_effective') }}% | Need: +{{ states('sensor.energy_deficit') }} kWh
          - action: script.inverter_set_mode_with_retry
            data:
              output_priority: GRID_CHARGE
              charge_priority: SOLAR_AND_GRID
              caller_tag: E cron15

      - alias: "Night + target already reached → autonomous"
        conditions:
          - condition: time
            after: "23:01:00"
            before: "06:58:00"
          - condition: template
            value_template: >
              {% set current = states('sensor.battery_soc_effective') | float(-1) %}
              {% set target = states('sensor.target_soc_tonight') | int(20) %}
              {% set threshold = [target + 2, 95] | min %}
              {{ current >= 0 and current >= threshold }}
          - condition: state
            entity_id: select.inverter_output_priority
            state: GRID_CHARGE
        sequence:
          - action: select.select_option
            target:
              entity_id: select.inverter_output_priority
            data:
              option: AUTONOMOUS
          - action: select.select_option
            target:
              entity_id: select.inverter_charge_priority
            data:
              option: SOLAR_ONLY
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                EMS: grid back, target already met (E)
                SOC: {{ states('sensor.battery_soc_effective') }}% ≥ target {{ states('sensor.target_soc_tonight') | int }}%

      - alias: "Daytime (06:58–23:01) → autonomous"
        conditions:
          - condition: time
            after: "06:58:00"
            before: "23:01:00"
          - condition: state
            entity_id: select.inverter_output_priority
            state: GRID_CHARGE
        sequence:
          - action: select.select_option
            target:
              entity_id: select.inverter_output_priority
            data:
              option: AUTONOMOUS
          - action: select.select_option
            target:
              entity_id: select.inverter_charge_priority
            data:
              option: SOLAR_ONLY
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: "EMS: grid back in daytime (E) — inverter set to autonomous mode."

      - alias: "Emergency: battery < 49 V → grid-charge"
        conditions:
          - condition: numeric_state
            entity_id: sensor.battery_voltage
            below: 49
        sequence:
          - action: select.select_option
            target:
              entity_id: select.inverter_output_priority
            data:
              option: GRID_CHARGE
          - action: select.select_option
            target:
              entity_id: select.inverter_charge_priority
            data:
              option: SOLAR_AND_GRID
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                ⚠️ EMS: EMERGENCY — battery < 49 V (E)
                Battery: {{ states('sensor.battery_voltage') }} V. Inverter set to grid-charge.

mode: single
trace:
  stored_traces: 30
