# Automation B: Stop grid charging when the target SOC is reached
# =================================================================
# Watches SOC through the night. As soon as SOC has held at or above
# min(target + 2 %, 95 %) for 30 seconds while the inverter is in grid-charge
# mode, switches back to autonomous mode.
#
# ── v3.1 — synced with production ──────────────────────────────────────────
#   - Reads the LIVE target (sensor.target_soc_tonight), not a value locked at
#     23:05. The target falls through the night as the remaining night's
#     consumption shrinks, so B stops charging as soon as the battery holds
#     enough for what is left — and it also knows the real target on nights
#     when charging was started by C or E instead of A.
#   - Mode change goes through script.inverter_set_mode_with_retry.
#
# Design decisions (unchanged):
#   for: 30 seconds — BMS units commonly report SOC as `unknown` for ~35 s
#   during charging; a 2-minute window almost never completes.
#   +2 % buffer — so B doesn't stop right at the target and immediately hand
#   over to C, which would start again. 95 % cap so B can't stall.
#
# Known issue: the trigger `deficit_below_0_5` (id below) has no matching
# branch in `choose` — it is a leftover from an earlier design and does
# nothing. Kept so the file matches the running automation.
#
# Entity ID mapping (replace with your own):
#   sensor.battery_soc_effective    → SOC sensor
#   sensor.target_soc_tonight       → target SOC template sensor (%)
#   sensor.energy_deficit           → energy deficit template sensor (kWh)
#   select.inverter_output_priority → output-source-priority select
#   script.inverter_set_mode_with_retry, notify.YOUR_TELEGRAM_BOT

alias: "EMS: Stop charging at target (B)"
description: >
  v3.1 — switches the inverter back to autonomous mode when SOC ≥
  min(live target + 2 %, 95 %) stable for 30 s, while grid-charging at night.

triggers:
  - trigger: state
    entity_id: sensor.battery_soc_effective
    for:
      seconds: 30
    id: soc_reached
  - trigger: numeric_state
    entity_id: sensor.energy_deficit
    below: 0.5
    for:
      minutes: 10
    id: deficit_below_0_5

conditions:
  - condition: state
    entity_id: select.inverter_output_priority
    state: GRID_CHARGE
  - condition: time
    after: "23:05:00"
    before: "06:57:00"
  - alias: "SOC reading is valid"
    condition: not
    conditions:
      - condition: state
        entity_id: sensor.battery_soc_effective
        state: ["unavailable", "unknown", "none", "None", ""]

actions:
  - choose:
      - alias: "SOC ≥ live target + 2 %"
        conditions:
          - condition: trigger
            id: soc_reached
          - condition: template
            value_template: >
              {% set current = states('sensor.battery_soc_effective') | float(-1) %}
              {% set target = states('sensor.target_soc_tonight') | int(20) %}
              {% set threshold = [target + 2, 95] | min %}
              {{ current >= 0 and current >= threshold }}
        sequence:
          - action: notify.send_message
            target:
              entity_id: notify.YOUR_TELEGRAM_BOT
            data:
              message: >
                EMS: target reached, charging stopped (B)
                SOC: {{ states('sensor.battery_soc_effective') }}% ≥ target {{ states('sensor.target_soc_tonight') | int }}% + 2%
          - action: script.inverter_set_mode_with_retry
            data:
              output_priority: AUTONOMOUS
              charge_priority: SOLAR_ONLY
              caller_tag: B
              fail_context: "Still charging!"

mode: single
trace:
  stored_traces: 30
