# Automation F: Recovery after Home Assistant restart
# =====================================================
# Fires on Home Assistant start. Waits 2 minutes for the inverter integration
# and the 7-day load statistics helper to report real values, then checks
# whether the inverter should be grid-charging but isn't — e.g. HA restarted
# mid-night and missed the window in which A, C or E would have acted.
#
# ── v3.1 — synced with production ──────────────────────────────────────────
#   - Requires the grid to be present (inverter input > 200 V), so a restart
#     during an outage doesn't "start" charging; E picks it up when the grid
#     returns.
#   - Still writes the selects directly and notifies locally
#     (persistent_notification), not via Telegram.
#   - The SOC check only rejects `unavailable` (not `unknown`).
#
# Entity ID mapping (replace with your own):
#   sensor.battery_soc_effective, sensor.avg_load_7d (sanity check that the
#   statistics helper has data), sensor.energy_deficit,
#   sensor.inverter_grid_voltage, select.inverter_output_priority,
#   select.inverter_charge_priority

alias: "EMS: Recovery after HA restart (F)"
description: >
  v3.1 — after HA start + 120 s: night, SOC valid, load history valid,
  deficit > 0.5 kWh, inverter autonomous, grid present → grid-charge.

triggers:
  - trigger: homeassistant
    event: start

conditions: []

actions:
  - delay:
      seconds: 120
  - choose:
      - alias: "Night, SOC valid, load history valid, charge needed, grid present"
        conditions:
          - condition: time
            after: "23:05:00"
            before: "06:57:00"
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.battery_soc_effective
                state: "unavailable"
          - condition: numeric_state
            entity_id: sensor.avg_load_7d
            above: 5
          - condition: numeric_state
            entity_id: sensor.energy_deficit
            above: 0.5
          - condition: state
            entity_id: select.inverter_output_priority
            state: AUTONOMOUS
          - alias: "Grid present"
            condition: numeric_state
            entity_id: sensor.inverter_grid_voltage
            above: 200
        sequence:
          - action: select.select_option
            target:
              entity_id: select.inverter_output_priority
            data:
              option: GRID_CHARGE
          - action: select.select_option
            target:
              entity_id: select.inverter_charge_priority
            data:
              option: SOLAR_AND_GRID
          - action: notify.persistent_notification
            data:
              title: "EMS: recovery after HA restart"
              message: >
                HA restarted at night. Inverter switched to grid-charge (F).
                SOC: {{ states('sensor.battery_soc_effective') }}% | Need: {{ states('sensor.energy_deficit') }} kWh

mode: single
